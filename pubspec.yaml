name: tudlo
description: Tudlo mobile learning application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  rive: ^0.14.10
  sensors_plus: ^7.1.0
  vector_graphics: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: ComicRelief
      fonts:
        - asset: assets/fonts/ComicRelief-Regular.ttf
          weight: 400
        - asset: assets/fonts/ComicRelief-Bold.ttf
          weight: 700
